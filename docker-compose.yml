version: "3.9"

# =============================================================================
# SafeVoyage Sentinel – Docker Compose
#
# Services:
#   gateway   – Node.js 20 Express + Vite SPA (port 8080)
#   fastapi   – Python 3.11 FastAPI microservice (port 8000, internal only)
#
# Usage:
#   # Development (with live reload):
#   docker compose up --build
#
#   # Production-like:
#   GEMINI_API_KEY=<key> docker compose up --build -d
# =============================================================================

services:

  # ---------------------------------------------------------------------------
  # Node.js Express Gateway + Vite React SPA
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: safevoyage-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      # Points to the internal Docker network hostname of the FastAPI service
      FASTAPI_SERVICE_URL: http://fastapi:8000
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - sentinel-net

  # ---------------------------------------------------------------------------
  # Python FastAPI Microservice (Driver, Passenger, Transit, Risk, Auth, etc.)
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: safevoyage-fastapi
    restart: unless-stopped
    # Intentionally NOT exposed to the host — only reachable from gateway
    expose:
      - "8000"
    environment:
      PORT: "8000"
      # Supply your real DB connection string and JWT secret via .env or CI secrets
      DATABASE_URL: ${DATABASE_URL:-sqlite+aiosqlite:///./sentinel.db}
      SECRET_KEY: ${SECRET_KEY:-change-me-in-production}
      ALGORITHM: ${ALGORITHM:-HS256}
      ACCESS_TOKEN_EXPIRE_MINUTES: ${ACCESS_TOKEN_EXPIRE_MINUTES:-30}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      FIREBASE_CREDENTIALS: ${FIREBASE_CREDENTIALS:-}
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - sentinel-net

networks:
  sentinel-net:
    driver: bridge
