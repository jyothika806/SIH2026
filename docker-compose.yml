version: "3.9"

# =============================================================================
# SafeVoyage Sentinel – Docker Compose
#
# Services:
#   gateway   – Node.js 20 Express + Vite SPA (port 8080)
#   fastapi   – Python 3.11 FastAPI microservice (port 8000, internal only)
#
# Usage:
#   # Development (with live reload):
#   docker compose up --build
#
#   # Production-like:
#   GEMINI_API_KEY=<key> docker compose up --build -d
# =============================================================================

services:

  postgres:
    image: postgis/postgis:16-3.4
    container_name: optimalride-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-optimalride}
      POSTGRES_USER: ${POSTGRES_USER:-optimalride}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U \"$${POSTGRES_USER}\" -d \"$${POSTGRES_DB}\""]
      interval: 5s
      timeout: 5s
      retries: 10
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - sentinel-net

  redis:
    image: redis:7-alpine
    container_name: optimalride-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10
    volumes:
      - redis-data:/data
    networks:
      - sentinel-net

  # ---------------------------------------------------------------------------
  # Node.js Express Gateway + Vite React SPA
  # ---------------------------------------------------------------------------
  gateway:
    build:
      context: .
      dockerfile: Dockerfile.gateway
    container_name: safevoyage-gateway
    restart: unless-stopped
    ports:
      - "8080:8080"
    environment:
      NODE_ENV: production
      PORT: "8080"
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      GEMINI_MODEL: ${GEMINI_MODEL:-gemini-3.8-flash}
      # Points to the internal Docker network hostname of the FastAPI service
      FASTAPI_SERVICE_URL: http://fastapi:8000
    depends_on:
      fastapi:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:8080/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 15s
      retries: 3
    networks:
      - sentinel-net

  # ---------------------------------------------------------------------------
  # Python FastAPI Microservice (Driver, Passenger, Transit, Risk, Auth, etc.)
  # ---------------------------------------------------------------------------
  fastapi:
    build:
      context: .
      dockerfile: Dockerfile.fastapi
    container_name: safevoyage-fastapi
    restart: unless-stopped
    # Intentionally NOT exposed to the host — only reachable from gateway
    expose:
      - "8000"
    environment:
      PORT: "8000"
      ENVIRONMENT: ${ENVIRONMENT:-development}
      DATABASE_URL: ${DATABASE_URL:?Set DATABASE_URL in .env}
      JWT_SECRET_KEY: ${JWT_SECRET_KEY:?Set JWT_SECRET_KEY in .env}
      OTP_HMAC_KEY: ${OTP_HMAC_KEY:?Set OTP_HMAC_KEY in .env}
      LICENCE_HMAC_KEY: ${LICENCE_HMAC_KEY:?Set LICENCE_HMAC_KEY in .env}
      FERNET_KEY: ${FERNET_KEY:?Set FERNET_KEY in .env}
      REDIS_URL: redis://redis:6379/0
      DEV_OTP_CODE: ${DEV_OTP_CODE:-}
      AUTO_CREATE_SCHEMA: ${AUTO_CREATE_SCHEMA:-false}
      TWILIO_PHONE_NUMBER: ${TWILIO_PHONE_NUMBER:-}
      TWILIO_ACCOUNT_SID: ${TWILIO_ACCOUNT_SID:-}
      TWILIO_AUTH_TOKEN: ${TWILIO_AUTH_TOKEN:-}
      DIGILOCKER_CLIENT_ID: ${DIGILOCKER_CLIENT_ID:-}
      DIGILOCKER_CLIENT_SECRET: ${DIGILOCKER_CLIENT_SECRET:-}
      DIGILOCKER_ENABLED: ${DIGILOCKER_ENABLED:-false}
      LICENCE_CLASS_MAP_REVIEWED: ${LICENCE_CLASS_MAP_REVIEWED:-false}
      LICENCE_CLASS_MAP: ${LICENCE_CLASS_MAP:-}
      VEHICLE_CAPACITIES: ${VEHICLE_CAPACITIES:-}
      VERIFICATION_REGION: ${VERIFICATION_REGION:-Karnataka}
    healthcheck:
      test: ["CMD", "python", "-c",
        "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 30s
      timeout: 5s
      start_period: 20s
      retries: 3
    networks:
      - sentinel-net
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

networks:
  sentinel-net:
    driver: bridge

volumes:
  postgres-data:
  redis-data:
